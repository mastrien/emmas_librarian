name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on tags starting with "v" (e.g., v1.0.0)

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ./emmas_librarian
        run: npm ci

      - name: Typecheck
        working-directory: ./emmas_librarian
        run: npm run typecheck

      - name: Unit and integration tests
        working-directory: ./emmas_librarian
        run: npm test

      # npm test rebuilds better-sqlite3 for the Node ABI; the packaged app needs the Electron ABI.
      - name: Rebuild native modules for Electron
        working-directory: ./emmas_librarian
        run: npm run rebuild:electron

      - name: Build and Publish
        working-directory: ./emmas_librarian
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run electron:build -- --publish always

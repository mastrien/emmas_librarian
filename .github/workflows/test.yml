name: Tests

on:
  push:
    branches: ['main']
    paths:
      - 'emmas_librarian/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'emmas_librarian/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  unit:
    # Windows matches the dev machine; Linux because the app ships an AppImage too (ext4 is case-sensitive,
    # NTFS is not, so a wrong-case import only breaks there). better-sqlite3 is a native module.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./emmas_librarian

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: emmas_librarian/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The tool schemas for models are read from the command handlers; a handler changed without regenerating fails here.
      - name: Command schemas up to date
        run: npm run schemas:check

      # Errors fail the build; the warning cap is a ratchet (lower it as `any`/effect warnings are fixed).
      - name: Lint
        run: npm run lint:ci

      - name: Unit and integration tests with coverage thresholds
        run: npm run coverage

  # The phone client in a real Chromium against a real desktop sync stack (mobile/e2e). It is the only test of the first
  # copy of the library to a phone, which the unit tests did not catch (#207). No display and no Electron needed.
  mobile-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./emmas_librarian

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: emmas_librarian/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The desktop side of the test uses SQLite from Node, and npm ci builds it for Electron.
      - name: Rebuild the native module for Node
        run: npm run rebuild:node

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Phone client E2E
        run: npm run test:mobile-e2e

      - name: Keep the failure context
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-failure
          path: emmas_librarian/test-results
          if-no-files-found: ignore
          retention-days: 7

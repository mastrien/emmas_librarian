name: Investigate installer crash (root cause)

# Experiments only (investigations/2026-10-installer-crash-root): install the published v1.1.23 on fresh
# throwaway runners, plain and under the cdb debugger, to find what raises 0xC0000005. Investigation branch only.
on:
  push:
    branches: [investigate/installer-crash-root]
    # The matrix is expensive: it only starts when this sentinel file changes (edit it to run it), not when the scripts do.
    paths:
      - 'investigations/2026-10-installer-crash-root/RUN-MATRIX'

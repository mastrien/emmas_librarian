name: Deploy Landing Page to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "landing_page/**"
      # The mobile client (#33) is published under /app/ beside the landing page.
      - "emmas_librarian/mobile/**"
      - "emmas_librarian/vite.mobile.config.mts"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build and deploy are separate jobs, as GitHub documents: with the upload and the deploy in the same job, the deploy
  # step ran two seconds after the upload and found "0 artifact(s)" (runs of #189 and of the merge of the stack).
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: emmas_librarian/package-lock.json

      # --ignore-scripts: the page needs no native module, and the postinstall would rebuild them for Electron.
      - name: Build the mobile client
        working-directory: emmas_librarian
        run: |
          npm ci --ignore-scripts
          npm run build:mobile

      # Served from a certificate browsers trust, so it installs as an app and opens project files offline.
      - name: Put the mobile client under /app/
        run: cp -r emmas_librarian/dist-mobile landing_page/app

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'landing_page'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

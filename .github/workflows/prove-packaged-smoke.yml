name: Prove the packaged-app smoke test (temporary)

# TEMPORARY: shows that release-tests/packagedApp.release.ts fails on the exact defect of v1.2.0/v1.2.1 and passes
# on a good build. Delete once the release workflow has been used.
on:
  workflow_dispatch:
  push:
    branches: [fix/release-native-abi]
    paths: ['.github/workflows/prove-packaged-smoke.yml']

permissions:
  contents: read

jobs:
  prove:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./emmas_librarian
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run electron:build -- --publish never

      - name: Control, a good build must pass
        run: npm run test:release-upgrade -- packagedApp.release.ts

      # The defect: better-sqlite3 built for Node inside the packaged app.
      - name: Put a Node-ABI better-sqlite3 into the packaged app
        run: |
          npm run rebuild:node
          src=node_modules/better-sqlite3/build/Release/better_sqlite3.node
          dst="release/win-unpacked/resources/app.asar.unpacked/node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          grep -a -o 'node_register_module_v[0-9]*' "$dst" | sort -u
          cp "$src" "$dst"
          grep -a -o 'node_register_module_v[0-9]*' "$dst" | sort -u

      - name: The same test must now fail
        run: |
          if npm run test:release-upgrade -- packagedApp.release.ts; then
            echo "::error::The smoke test passed on a build with a Node-ABI better-sqlite3"
            exit 1
          fi
          echo "Failed as it should."

name: Release upgrade test

# Before publishing, two checks that nothing in a library is lost (emmas_librarian/release-tests):
# - upgrade: the published release, filled with every kind of data, gets this build installed over it
#   the way the auto-updater does (upgrade.release.ts);
# - update-flow: two builds of this checkout, the older one finding the newer on a local update server
#   and updating through the app itself, snapshot and first-boot check included (updateFlow.release.ts).
# Slow, so not part of the Tests workflow.
on:
  workflow_dispatch:
    inputs:
      from_tag:
        description: "Published release to upgrade from (empty = latest)"
        required: false
        default: ""
  pull_request:
    paths:
      - "emmas_librarian/release-tests/**"
      - "emmas_librarian/playwright.release.config.js"
      - "emmas_librarian/electron/database/__tests__/support/**"
      # What the upgrade must not break: the schema and how it is migrated.
      - "emmas_librarian/electron/database/schemaMigrations.ts"
      - "emmas_librarian/electron/database/DatabaseAdapter.ts"
      - ".github/workflows/release-upgrade-test.yml"
      # The updater the update-flow test drives, end to end: main process, IPC, preload, and the two screens it
      # clicks by their button text ("Atualizar", "Reiniciar e Instalar Atualização").
      - "emmas_librarian/electron/services/Update*.ts"
      - "emmas_librarian/electron/services/RecoveryService.ts"
      - "emmas_librarian/electron/startupRecovery.ts"
      - "emmas_librarian/electron/main.ts"
      - "emmas_librarian/electron/preload.ts"
      - "emmas_librarian/electron/ipc/handlers/updateHandlers.ts"
      - "emmas_librarian/src/components/common/UpdateNotificationBanner.tsx"
      - "emmas_librarian/src/pages/Settings/components/UpdateSettings.tsx"

# Only reads the code and the published release; nothing here writes to the repository.
permissions:
  contents: read

jobs:
  upgrade:
    strategy:
      fail-fast: false
      matrix:
        # Linux installs the AppImage (issue #17); it runs once a published release has one to upgrade from.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ./emmas_librarian
        shell: bash

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # FUSE 2 runs the AppImage as users run it (Ubuntu 22.04+ ships without it). Ubuntu 24.04 blocks the
      # unprivileged user namespaces Electron's Chromium sandbox needs; lifting it keeps the sandbox on.
      - name: Prepare Linux to run the AppImage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libfuse2t64
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install dependencies
        run: npm ci

      - name: Download the published installer
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FROM_TAG: ${{ inputs.from_tag }}
        run: |
          native() { if [ "$RUNNER_OS" = Windows ]; then cygpath -w "$1"; else echo "$1"; fi; }
          tag="${FROM_TAG:-$(gh release view --json tagName -q .tagName)}"
          echo "Upgrading from $tag"
          mkdir -p "$RUNNER_TEMP/published"
          if [ "$RUNNER_OS" = Windows ]; then
            # The NSIS installer only: a release that gains another .exe (portable build) must not be picked by name order.
            gh release download "$tag" --pattern '*setup*.exe' --pattern '*Setup*.exe' --dir "$RUNNER_TEMP/published"
          elif ! gh release download "$tag" --pattern '*.AppImage' --dir "$RUNNER_TEMP/published"; then
            echo "::notice title=No AppImage in $tag::Nothing to upgrade from on Linux yet; the update-flow job covers it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          old="$(ls "$RUNNER_TEMP"/published/* | head -1)"
          echo "RELEASE_TEST_OLD_INSTALLER=$(native "$old")" >> "$GITHUB_ENV"
          echo "RELEASE_TEST_INSTALL_DIR=$(native "$RUNNER_TEMP/emma-app")" >> "$GITHUB_ENV"

      - name: Build this version's installer
        if: steps.published.outputs.skip != 'true'
        run: |
          native() { if [ "$RUNNER_OS" = Windows ]; then cygpath -w "$1"; else echo "$1"; fi; }
          npm run electron:build -- --publish never
          # One pattern per OS: a pattern with no match makes ls fail, and the step runs with pipefail.
          if [ "$RUNNER_OS" = Windows ]; then pattern='*Setup*.exe'; else pattern='*.AppImage'; fi
          new="$(ls "$PWD"/release/$pattern | head -1)"
          echo "RELEASE_TEST_NEW_INSTALLER=$(native "$new")" >> "$GITHUB_ENV"

      # The test reads and fills the installed library with better-sqlite3 from this checkout.
      - name: Rebuild native modules for Node
        if: steps.published.outputs.skip != 'true'
        run: npm run rebuild:node

      # Xvfb is the screen for the app on Linux; Windows runners have a desktop.
      - name: Upgrade and compare
        if: steps.published.outputs.skip != 'true'
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} npm run test:release-upgrade -- upgrade.release.ts

      # Dumps, transfer report and the app's main.log (the test copies it here).
      - name: Keep the dumps, reports and app logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-upgrade-${{ matrix.os }}
          path: emmas_librarian/test-results/release
          if-no-files-found: ignore

  update-flow:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          # Linux (issue #17), with and without a keyring: the API key must survive the update either way.
          # Without one, safeStorage falls back to basic_text; with GNOME's, it uses libsecret.
          - os: ubuntu-latest
            keyring: none
            key-storage: basic_text
          - os: ubuntu-latest
            keyring: gnome
            key-storage: gnome_libsecret
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      UPDATE_PORT: 8765
      FROM_VERSION: 9.0.0
      TO_VERSION: 9.0.1
      RELEASE_TEST_EXPECT_KEY_STORAGE: ${{ matrix.key-storage }}
    defaults:
      run:
        working-directory: ./emmas_librarian
        shell: bash

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # See the upgrade job; gnome-keyring only for the keyring variant.
      - name: Prepare Linux to run the AppImage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libfuse2t64 ${{ matrix.keyring == 'gnome' && 'gnome-keyring libsecret-tools' || '' }}
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install dependencies
        run: npm ci

      - name: Build two versions that update from a local server
        run: |
          native() { if [ "$RUNNER_OS" = Windows ]; then cygpath -w "$1"; else echo "$1"; fi; }
          npx vite build
          npx tsc -p tsconfig.electron.json
          node release-tests/build-update-pair.mjs "$UPDATE_PORT" "$FROM_VERSION" "$TO_VERSION"
          # One pattern per OS: a pattern with no match makes ls fail, and the step runs with pipefail.
          if [ "$RUNNER_OS" = Windows ]; then pattern='*Setup*.exe'; else pattern='*.AppImage'; fi
          from="$(ls "$PWD"/release-update/"$FROM_VERSION"/$pattern | head -1)"
          echo "RELEASE_TEST_UPDATE_FROM_INSTALLER=$(native "$from")" >> "$GITHUB_ENV"
          echo "RELEASE_TEST_UPDATE_FOLDER=$(native "$PWD/release-update/$TO_VERSION")" >> "$GITHUB_ENV"
          echo "RELEASE_TEST_UPDATE_FROM=$FROM_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TEST_UPDATE_TO=$TO_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TEST_UPDATE_PORT=$UPDATE_PORT" >> "$GITHUB_ENV"
          echo "RELEASE_TEST_INSTALL_DIR=$(native "$RUNNER_TEMP/emma-app")" >> "$GITHUB_ENV"
          ls release-update/"$TO_VERSION"

      # The test reads and fills the installed library with better-sqlite3 from this checkout.
      - name: Rebuild native modules for Node
        run: npm run rebuild:node

      - name: Update through the app and compare
        run: >-
          ${{ matrix.keyring == 'gnome' && 'dbus-run-session -- bash release-tests/with-keyring.sh' || '' }}
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }}
          npm run test:release-upgrade -- updateFlow.release.ts

      - name: Keep the dumps, reports and app logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-update-flow-${{ matrix.os }}${{ matrix.keyring && format('-{0}', matrix.keyring) || '' }}
          path: emmas_librarian/test-results/release

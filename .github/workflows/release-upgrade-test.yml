name: Release upgrade test

# Before publishing: install the published release, fill it with every kind of data, install this
# build over it the way the auto-updater does, and check nothing was lost
# (emmas_librarian/release-tests/upgrade.release.ts). Slow, so it is not part of the Tests workflow.
on:
  workflow_dispatch:
    inputs:
      from_tag:
        description: "Published release to upgrade from (empty = latest)"
        required: false
        default: ""
  pull_request:
    paths:
      - "emmas_librarian/release-tests/**"
      - "emmas_librarian/playwright.release.config.js"
      - "emmas_librarian/electron/database/__tests__/support/fullLibraryFixture.ts"
      - "emmas_librarian/electron/database/__tests__/support/fullProjectFixture.ts"
      - ".github/workflows/release-upgrade-test.yml"

jobs:
  upgrade:
    strategy:
      fail-fast: false
      matrix:
        # Linux (AppImage, Xvfb, keyring for safeStorage): issue #17.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ./emmas_librarian
        shell: bash

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build this version's installer
        run: npm run electron:build -- --publish never

      - name: Download the published installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FROM_TAG: ${{ inputs.from_tag }}
        run: |
          tag="${FROM_TAG:-$(gh release view --json tagName -q .tagName)}"
          echo "Upgrading from $tag"
          mkdir -p "$RUNNER_TEMP/published"
          gh release download "$tag" --pattern '*.exe' --dir "$RUNNER_TEMP/published"
          old="$(ls "$RUNNER_TEMP"/published/*.exe | head -1)"
          new="$(ls "$PWD"/release/*Setup*.exe | head -1)"
          echo "RELEASE_TEST_OLD_INSTALLER=$(cygpath -w "$old")" >> "$GITHUB_ENV"
          echo "RELEASE_TEST_NEW_INSTALLER=$(cygpath -w "$new")" >> "$GITHUB_ENV"
          echo "RELEASE_TEST_INSTALL_DIR=$(cygpath -w "$RUNNER_TEMP/emma-app")" >> "$GITHUB_ENV"
          echo "APP_LOGS=$(cygpath -w "$APPDATA/emmas_librarian/logs")" >> "$GITHUB_ENV"

      # TEMPORARY diagnostics: the published installer crashed (0xC0000005) when started from the test.
      - name: Diagnose installer start
        shell: pwsh
        run: |
          Write-Host "pwsh TEMP=$env:TEMP TMP=$env:TMP"
          bash -c 'echo "bash TEMP=$TEMP TMP=$TMP"; node -e "console.log(\"node-from-bash TEMP=\" + process.env.TEMP)"'
          foreach ($case in @(@{ n = 'old /S'; f = $env:RELEASE_TEST_OLD_INSTALLER; a = '/S' },
                              @{ n = 'old /S /D'; f = $env:RELEASE_TEST_OLD_INSTALLER; a = "/S /D=$env:RUNNER_TEMP\diag-old" },
                              @{ n = 'new /S /D'; f = $env:RELEASE_TEST_NEW_INSTALLER; a = "/S /D=$env:RUNNER_TEMP\diag-new" })) {
            $p = Start-Process -FilePath $case.f -ArgumentList $case.a -Wait -PassThru
            Write-Host ("{0}: exit {1} (0x{2:X8})" -f $case.n, $p.ExitCode, $p.ExitCode)
          }
          Get-ChildItem "$env:RUNNER_TEMP\diag-old", "$env:RUNNER_TEMP\diag-new", "$env:LOCALAPPDATA\Programs" -ErrorAction SilentlyContinue | Select-Object FullName
          bash -c 'node -e "const r=require(\"child_process\").spawnSync(process.env.RELEASE_TEST_OLD_INSTALLER,[\"/S\",\"/D=\"+process.env.RUNNER_TEMP+\"\\diag-node\"]);console.log(\"node-from-bash spawnSync status\",r.status)"'
        continue-on-error: true

      # The test reads and fills the installed library with better-sqlite3 from this checkout.
      - name: Rebuild native modules for Node
        run: npm run rebuild:node

      - name: Upgrade and compare
        run: npm run test:release-upgrade

      - name: Keep the dumps, reports and app logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-upgrade-${{ matrix.os }}
          path: |
            emmas_librarian/test-results/release
            ${{ env.APP_LOGS }}
          if-no-files-found: ignore

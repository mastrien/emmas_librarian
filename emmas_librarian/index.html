    <!--
      PrismJS: loaded as static scripts BEFORE the app bundle.
      This ensures window.Prism and all language grammars are fully initialized
      before @lexical/code (used by @mdxeditor/editor) tries to access them.
      Order matters: prism-core first, then markup (required by markdown),
      then clike (required by javascript/typescript/etc), then the rest.
    -->
    <script src="./vendor/prismjs/prism.js"></script>
    <script src="./vendor/prismjs/components/prism-markup.min.js"></script>
    <script src="./vendor/prismjs/components/prism-clike.min.js"></script>
